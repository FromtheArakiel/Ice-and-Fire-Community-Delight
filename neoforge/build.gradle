plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
    // Libraries that are nested into the jar in NeoForge's JarJar format.
    jarJarBundle {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Local content mods, matching the 1.21.1 NeoForge builds.
    modImplementation files(rootProject.file('libs/iceandfire-2.1.3.jar'))
    modImplementation files(rootProject.file('libs/FarmersDelight-1.21.1-1.3.4.jar'))
    modImplementation files(rootProject.file('libs/Patchouli-1.21.1-93-NEOFORGE.jar'))

    // NightConfig is nested with JarJar (see the processResources block below), so the finished
    // mod carries its own config library. Architectury API stays a normal dependency.
    jarJarBundle "com.electronwill.night-config:core:$rootProject.nightconfig_version"
    jarJarBundle "com.electronwill.night-config:toml:$rootProject.nightconfig_version"
}

// ---------------------------------------------------------------------------------------------
// JarJar: nest the libraries above and describe them in META-INF/jarjar/metadata.json
// ---------------------------------------------------------------------------------------------
def jarJarLibraries = [
        [group: 'com.electronwill.night-config', name: 'core',                 version: rootProject.nightconfig_version],
        [group: 'com.electronwill.night-config', name: 'toml',                 version: rootProject.nightconfig_version]
]

def jarJarMetadataJson = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        jars: jarJarLibraries.collect { library ->
                [
                        identifier  : [group: library.group, artifact: library.name],
                        version     : [range: "[${library.version},)", artifactVersion: library.version],
                        path        : "META-INF/jarjar/${library.name}-${library.version}.jar",
                        isObfuscated: false
                ]
        }
]))

def jarJarMetadataDir = layout.buildDirectory.dir('generated/jarjar-metadata')

def writeJarJarMetadata = tasks.register('writeJarJarMetadata') {
    def outputDirectory = jarJarMetadataDir
    def metadata = jarJarMetadataJson
    outputs.dir(outputDirectory)
    doLast {
        def target = outputDirectory.get().asFile.toPath().resolve('META-INF/jarjar')
        java.nio.file.Files.createDirectories(target)
        java.nio.file.Files.writeString(target.resolve('metadata.json'), metadata)
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }

    dependsOn writeJarJarMetadata
    from(configurations.jarJarBundle) {
        into 'META-INF/jarjar'
    }
    from(jarJarMetadataDir)
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
