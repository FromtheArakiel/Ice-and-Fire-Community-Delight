architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    // Uranus and Jupiter - the libraries Ice and Fire Community Edition itself depends on. They are
    // needed on the compile classpath because our loot function touches an Ice and Fire entity.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // The content mods this addon is built on. They are local jars, so the build never needs to
    // reach a remote repository for them. Compile only: the platform projects bundle nothing.
    modCompileOnly files(rootProject.file('libs/IceAndFireCE-2.0-beta.15-1.21.1-fabric.jar'))
    modCompileOnly files(rootProject.file('libs/FarmersDelight-1.21.1-3.3.6+refabricated.jar'))
    modCompileOnly files(rootProject.file('libs/Patchouli-1.21.1-93-FABRIC.jar'))

    // JEI is an integration, not a dependency: only the Fabric jar is needed to compile
    // JeiIntegration, the plugin is discovered by JEI itself and nothing is shipped.
    modCompileOnly files(rootProject.file('libs/jei-1.21.1-fabric-19.56.0.439.jar'))

    // NightConfig (TOML) - the config library used by ModConfig.
    // Both platform projects nest it into the jar, so it is compile only here.
    compileOnly "com.electronwill.night-config:core:$rootProject.nightconfig_version"
    compileOnly "com.electronwill.night-config:toml:$rootProject.nightconfig_version"

    // Transitive dependencies of Ice and Fire Community Edition (the Uranus animation library and
    // the Jupiter config library). Compile only: the game gets them together with Ice and Fire.
    compileOnly "curse.maven:uranus-1010827:8682870"
    compileOnly "curse.maven:jupiter-1072905:7738312"
}
